<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Notes 3.0</title>
<link rel="icon" type="image/png" href="icon.png">

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f2f4f7;
color:#222;
}

header{
background:#222;
color:white;
padding:18px;
text-align:center;
}

header h1{margin:0 0 12px}

.container{
max-width:650px;
margin:auto;
padding:15px;
}

button{
border:0;
border-radius:10px;
padding:11px 14px;
font-size:15px;
cursor:pointer;
}

.tools{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
margin-bottom:12px;
}

.tool{
background:#444;
color:white;
width:100%;
}

.add{
width:100%;
background:#222;
color:white;
margin-bottom:12px;
}

input,textarea,select{
width:100%;
padding:13px;
margin-bottom:10px;
border:1px solid #ccc;
border-radius:10px;
font-size:16px;
}

textarea{
height:140px;
resize:none;
}

.save{
width:100%;
background:#16834b;
color:white;
}

.search{
margin-top:5px;
}

.note{
background:white;
margin-top:15px;
padding:15px;
border-radius:13px;
box-shadow:0 3px 10px #ccc;
}

.note h3{margin-top:0}

.note p{
white-space:pre-wrap;
}

.category{
display:inline-block;
background:#eee;
padding:5px 9px;
border-radius:20px;
font-size:12px;
margin-bottom:8px;
}

.note-buttons{
display:flex;
flex-wrap:wrap;
gap:6px;
margin-top:10px;
}

.edit{background:#ddd}
.delete{background:#d33;color:white}
.favorite{background:#ffd84d}
.share{background:#16834b;color:white}
.restore{background:#16834b;color:white}

.section{
margin-top:18px;
font-size:18px;
font-weight:bold;
}

#editor,#calculator,#bin{
display:none;
}

#calculator{
background:white;
padding:15px;
border-radius:15px;
box-shadow:0 3px 10px #ccc;
}

.calc-display{
height:55px;
text-align:right;
font-size:25px;
}

.calc-grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:7px;
}

.calc-grid button{
font-size:19px;
background:#e5e5e5;
}

.operator{
background:#222!important;
color:white;
}

.equal{
background:#16834b!important;
color:white;
}

.clear{
background:#d33!important;
color:white;
}

#pinScreen{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#111;
display:flex;
align-items:center;
justify-content:center;
z-index:99999;
}

.pin-box{
width:90%;
max-width:380px;
background:white;
padding:30px 20px;
border-radius:20px;
text-align:center;
}

.pin-input{
text-align:center;
letter-spacing:7px;
font-size:25px;
}

.pin-button{
width:100%;
background:#16834b;
color:white;
}

.pin-error{
color:#d33;
min-height:25px;
margin-bottom:8px;
}

.dark{
background:#181818;
color:white;
}

.dark .note,
.dark #calculator{
background:#292929;
color:white;
}

.dark input,
.dark textarea,
.dark select{
background:#292929;
color:white;
border-color:#555;
}

.dark .edit{
background:#555;
color:white;
}

.dark .category{
background:#555;
color:white;
}

.dark header{background:#000}

.empty{
text-align:center;
padding:25px;
opacity:.7;
}
</style>
</head>

<body>

<!-- PIN -->

<div id="pinScreen">
<div class="pin-box">

<h2>🔐 My Notes</h2>

<p id="pinMessage">
আপনার জন্য একটি 4–6 digit PIN তৈরি করুন
</p>

<input
id="pinInput"
class="pin-input"
type="password"
inputmode="numeric"
maxlength="6"
placeholder="••••••">

<div class="pin-error" id="pinError"></div>

<button class="pin-button" id="pinButton">
🔓 Continue
</button>

</div>
</div>


<header>

<h1>📝 My Notes</h1>

<button onclick="darkMode()">
🌙 Dark Mode
</button>

</header>


<div class="container">

<div class="tools">

<button class="tool" onclick="openCalculator()">
🧮 Calculator
</button>

<button class="tool" onclick="changePIN()">
🔑 Change PIN
</button>

</div>


<!-- Calculator -->

<div id="calculator">

<input
id="calcDisplay"
class="calc-display"
type="text"
readonly>

<div class="calc-grid">

<button class="clear" onclick="clearCalc()">C</button>
<button onclick="backspace()">⌫</button>
<button onclick="calcInput('%')">%</button>
<button class="operator" onclick="calcInput('/')">÷</button>

<button onclick="calcInput('7')">7</button>
<button onclick="calcInput('8')">8</button>
<button onclick="calcInput('9')">9</button>
<button class="operator" onclick="calcInput('*')">×</button>

<button onclick="calcInput('4')">4</button>
<button onclick="calcInput('5')">5</button>
<button onclick="calcInput('6')">6</button>
<button class="operator" onclick="calcInput('-')">−</button>

<button onclick="calcInput('1')">1</button>
<button onclick="calcInput('2')">2</button>
<button onclick="calcInput('3')">3</button>
<button class="operator" onclick="calcInput('+')">+</button>

<button onclick="calcInput('0')">0</button>
<button onclick="calcInput('.')">.</button>

<button
class="equal"
style="grid-column:span 2"
onclick="calculate()">
=
</button>

</div>
</div>


<!-- Add -->

<button class="add" onclick="openEditor()">
➕ Add New Note
</button>


<!-- Editor -->

<div id="editor">

<input
id="titleInput"
type="text"
placeholder="Note-এর Title লিখুন">

<select id="categoryInput">

<option value="Study">📚 Study</option>
<option value="Personal">👤 Personal</option>
<option value="Work">💼 Work</option>
<option value="Important">⭐ Important</option>
<option value="Other">📌 Other</option>

</select>

<textarea
id="textInput"
placeholder="আপনার Note লিখুন..."></textarea>

<button class="save" onclick="saveNote()">
💾 Save Note
</button>

</div>


<!-- Search -->

<input
id="search"
class="search"
type="text"
placeholder="🔍 Note খুঁজুন...">


<!-- Categories -->

<select id="filterCategory" onchange="showNotes()">

<option value="All">📋 All Categories</option>
<option value="Study">📚 Study</option>
<option value="Personal">👤 Personal</option>
<option value="Work">💼 Work</option>
<option value="Important">⭐ Important</option>
<option value="Other">📌 Other</option>

</select>


<div class="section">
📝 My Notes
</div>

<div id="notes"></div>


<!-- Recycle Bin -->

<div class="section">
🗑️ Recycle Bin
</div>

<div id="bin"></div>

</div>


<script>

/* =========================
PIN
========================= */

const pinButton =
document.getElementById("pinButton");

const pinInput =
document.getElementById("pinInput");

const pinError =
document.getElementById("pinError");

function setupPIN(){

const saved =
localStorage.getItem("notesPIN");

document.getElementById("pinMessage").innerText =
saved
? "আপনার PIN দিন"
: "আপনার জন্য একটি 4–6 digit PIN তৈরি করুন";

}


function unlockApp(){

document.getElementById("pinScreen").style.display="none";

showNotes();

showBin();

}


function submitPIN(){

const pin =
pinInput.value.trim();

pinError.innerText="";

if(!/^[0-9]{4,6}$/.test(pin)){

pinError.innerText=
"PIN অবশ্যই 4–6 সংখ্যার হতে হবে।";

return;

}

const saved =
localStorage.getItem("notesPIN");

if(!saved){

localStorage.setItem("notesPIN",pin);

unlockApp();

return;

}

if(pin===saved){

unlockApp();

}else{

pinError.innerText=
"❌ PIN সঠিক নয়।";

pinInput.value="";

}

}


pinButton.addEventListener(
"click",
submitPIN
);

pinInput.addEventListener(
"keydown",
function(e){

if(e.key==="Enter")
submitPIN();

});


/* =========================
NOTES
========================= */

let editIndex=-1;


function openEditor(){

document.getElementById("editor").style.display="block";

document.getElementById("titleInput").focus();

}


function saveNote(){

const title =
document.getElementById("titleInput").value.trim();

const text =
document.getElementById("textInput").value.trim();

const category =
document.getElementById("categoryInput").value;

if(title==="" && text===""){

alert("আগে Note লিখুন!");

return;

}

let notes =
JSON.parse(localStorage.getItem("notes")) || [];

const note={

title:title,

text:text,

category:category,

favorite:false,

date:new Date().toLocaleString("bn-BD")

};

if(editIndex===-1){

notes.push(note);

}else{

note.favorite =
notes[editIndex].favorite || false;

notes[editIndex]=note;

editIndex=-1;

}

localStorage.setItem(
"notes",
JSON.stringify(notes)
);

document.getElementById("titleInput").value="";

document.getElementById("textInput").value="";

document.getElementById("editor").style.display="none";

showNotes();

}


function showNotes(){

const notes =
JSON.parse(localStorage.getItem("notes")) || [];

const search =
document.getElementById("search").value.toLowerCase();

const filter =
document.getElementById("filterCategory").value;

const container =
document.getElementById("notes");

container.innerHTML="";

let found=false;

notes.forEach(function(note,index){

const title =
(note.title||"").toLowerCase();

const text =
(note.text||"").toLowerCase();

if(
(title.includes(search)||text.includes(search)) &&
(filter==="All"||note.category===filter)
){

found=true;

const div=document.createElement("div");

div.className="note";

const h3=document.createElement("h3");

h3.innerText =
(note.favorite?"⭐ ":"📌 ") +
(note.title||"Untitled");

const cat=document.createElement("span");

cat.className="category";

cat.innerText=note.category||"Other";

const p=document.createElement("p");

p.innerText=note.text||"";

const small=document.createElement("small");

small.innerText="🕒 "+(note.date||"");

const buttons=document.createElement("div");

buttons.className="note-buttons";


const fav=document.createElement("button");

fav.className="favorite";

fav.innerText =
note.favorite
? "⭐ Unfavorite"
: "☆ Favorite";

fav.onclick=function(){

toggleFavorite(index);

};


const edit=document.createElement("button");

edit.className="edit";

edit.innerText="✏️ Edit";

edit.onclick=function(){

editNote(index);

};


const share=document.createElement("button");

share.className="share";

share.innerText="📤 Share";

share.onclick=function(){

shareNote(index);

};


const del=document.createElement("button");

del.className="delete";

del.innerText="🗑️ Delete";

del.onclick=function(){

deleteNote(index);

};


buttons.appendChild(fav);

buttons.appendChild(edit);

buttons.appendChild(share);

buttons.appendChild(del);

div.appendChild(h3);

div.appendChild(cat);

div.appendChild(p);

div.appendChild(small);

div.appendChild(buttons);

container.appendChild(div);

}

});

if(!found){

container.innerHTML=
'<div class="empty">কোনো Note পাওয়া যায়নি।</div>';

}

}


document.getElementById("search")
.addEventListener("input",showNotes);


/* =========================
FAVORITE
========================= */

function toggleFavorite(index){

let notes =
JSON.parse(localStorage.getItem("notes")) || [];

notes[index].favorite =
!notes[index].favorite;

localStorage.setItem(
"notes",
JSON.stringify(notes)
);

showNotes();

}


/* =========================
EDIT
========================= */

function editNote(index){

const notes =
JSON.parse(localStorage.getItem("notes")) || [];

document.getElementById("titleInput").value =
notes[index].title||"";

document.getElementById("textInput").value =
notes[index].text||"";

document.getElementById("categoryInput").value =
notes[index].category||"Other";

editIndex=index;

document.getElementById("editor").style.display="block";

window.scrollTo(0,0);

}


/* =========================
DELETE / RECYCLE BIN
========================= */

function deleteNote(index){

if(!confirm("Note Recycle Bin-এ পাঠাবেন?"))
return;

let notes =
JSON.parse(localStorage.getItem("notes")) || [];

let bin =
JSON.parse(localStorage.getItem("bin")) || [];

const deleted=notes.splice(index,1)[0];

deleted.deletedAt =
new Date().toLocaleString("bn-BD");

bin.push(deleted);

localStorage.setItem(
"notes",
JSON.stringify(notes)
);

localStorage.setItem(
"bin",
JSON.stringify(bin)
);

showNotes();

showBin();

}


function showBin(){

const bin =
JSON.parse(localStorage.getItem("bin")) || [];

const container =
document.getElementById("bin");

container.innerHTML="";

if(bin.length===0){

container.innerHTML=
'<div class="empty">Recycle Bin খালি।</div>';

return;

}

bin.forEach(function(note,index){

const div=document.createElement("div");

div.className="note";

const h3=document.createElement("h3");

h3.innerText="🗑️ "+(note.title||"Untitled");

const p=document.createElement("p");

p.innerText=note.text||"";

const restore=document.createElement("button");

restore.className="restore";

restore.innerText="♻️ Restore";

restore.onclick=function(){

restoreNote(index);

};


const permanent=document.createElement("button");

permanent.className="delete";

permanent.innerText="❌ Delete Forever";

permanent.style.marginLeft="6px";

permanent.onclick=function(){

deleteForever(index);

};


div.appendChild(h3);

div.appendChild(p);

div.appendChild(restore);

div.appendChild(permanent);

container.appendChild(div);

});

}


function restoreNote(index){

let bin =
JSON.parse(localStorage.getItem("bin")) || [];

let notes =
JSON.parse(localStorage.getItem("notes")) || [];

const note=bin.splice(index,1)[0];

delete note.deletedAt;

notes.push(note);

localStorage.setItem(
"notes",
JSON.stringify(notes)
);

localStorage.setItem(
"bin",
JSON.stringify(bin)
);

showNotes();

showBin();

}


function deleteForever(index){

if(!confirm("এই Note চিরতরে Delete করবেন?"))
return;

let bin =
JSON.parse(localStorage.getItem("bin")) || [];

bin.splice(index,1);

localStorage.setItem(
"bin",
JSON.stringify(bin)
);

showBin();

}


/* =========================
SHARE
========================= */

function shareNote(index){

const notes =
JSON.parse(localStorage.getItem("notes")) || [];

const note=notes[index];

const text =
"📝 "+(note.title||"My Note")+
"\n\n"+(note.text||"");

if(navigator.share){

navigator.share({

title:note.title||"My Note",

text:text

}).catch(function(){});

}else{

navigator.clipboard.writeText(text);

alert("Note কপি হয়েছে। এখন যেখানে চান Paste করুন।");

}

}


/* =========================
DARK MODE
========================= */

function darkMode(){

document.body.classList.toggle("dark");

localStorage.setItem(
"darkMode",
document.body.classList.contains("dark")
);

}

if(
localStorage.getItem("darkMode")==="true"
){

document.body.classList.add("dark");

}


/* =========================
CALCULATOR
========================= */

function openCalculator(){

const c =
document.getElementById("calculator");

c.style.display =
c.style.display==="block"
? "none"
: "block";

}


function calcInput(value){

document.getElementById("calcDisplay")
.value += value;

}


function clearCalc(){

document.getElementById("calcDisplay")
.value="";

}


function backspace(){

const d =
document.getElementById("calcDisplay");

d.value=d.value.slice(0,-1);

}


function calculate(){

const d =
document.getElementById("calcDisplay");

const expression=d.value;

if(!expression)return;

if(!/^[0-9+\-*/%.() ]+$/.test(expression)){

d.value="Error";

return;

}

try{

const result =
Function(
'"use strict"; return ('+
expression+
')'
)();

d.value=result;

}catch(e){

d.value="Error";

}

}


/* =========================
CHANGE PIN
========================= */

function changePIN(){

const oldPIN =
localStorage.getItem("notesPIN");

const current =
prompt("বর্তমান PIN লিখুন");

if(current!==oldPIN){

alert("❌ PIN সঠিক নয়।");

return;

}

const newPIN =
prompt("নতুন 4–6 সংখ্যার PIN দিন");

if(!/^[0-9]{4,6}$/.test(newPIN)){

alert(
"PIN অবশ্যই 4–6 সংখ্যার হতে হবে।"
);

return;

}

localStorage.setItem(
"notesPIN",
newPIN
);

alert(
"✅ PIN সফলভাবে পরিবর্তন হয়েছে।"
);

}


/* START */

setupPIN();

showNotes();

showBin();

</script>

</body>
    </html>
