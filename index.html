<!DOCTYPE html>
<html lang="bn">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Notes</title>

<link rel="icon" type="image/png" href="icon.png">

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f2f4f7;
  color: #222;
}

header {
  background: #222;
  color: white;
  padding: 20px;
  text-align: center;
}

header h1 {
  margin: 0 0 10px;
}

.container {
  max-width: 600px;
  margin: auto;
  padding: 15px;
}

input,
textarea {
  width: 100%;
  padding: 14px;
  margin-bottom: 12px;
  border: 1px solid #ccc;
  border-radius: 10px;
  font-size: 16px;
  outline: none;
}

textarea {
  height: 150px;
  resize: none;
}

button {
  border: none;
  border-radius: 10px;
  padding: 12px 16px;
  font-size: 15px;
  cursor: pointer;
}

.add {
  width: 100%;
  background: #222;
  color: white;
  margin-bottom: 15px;
}

.save {
  width: 100%;
  background: #16834b;
  color: white;
}

.search {
  margin-top: 10px;
}

.note {
  background: white;
  margin-top: 15px;
  padding: 16px;
  border-radius: 12px;
  box-shadow: 0 3px 10px #ccc;
}

.note h3 {
  margin-top: 0;
}

.note p {
  white-space: pre-wrap;
}

.edit {
  background: #ddd;
  margin-right: 5px;
}

.delete {
  background: #d33;
  color: white;
}

.dark {
  background: #181818;
  color: white;
}

.dark .note {
  background: #292929;
  color: white;
}

.dark input,
.dark textarea {
  background: #292929;
  color: white;
  border-color: #555;
}

.dark .edit {
  background: #555;
  color: white;
}

.dark header {
  background: #000;
}

#editor {
  display: none;
}

</style>
</head>

<body>

<header>

<h1>📝 My Notes</h1>

<button onclick="darkMode()">
🌙 Dark Mode
</button>

</header>

<div class="container">

<button class="add" onclick="openEditor()">
➕ Add New Note
</button>

<div id="editor">

<input
id="titleInput"
type="text"
placeholder="Note-এর Title লিখুন">

<textarea
id="textInput"
placeholder="আপনার Note লিখুন...">
</textarea>

<button class="save" onclick="saveNote()">
💾 Save Note
</button>

</div>

<input
class="search"
id="search"
type="text"
placeholder="🔍 Note খুঁজুন..."
oninput="showNotes()">

<div id="notes"></div>

</div>

<script>

let editIndex = -1;

function openEditor() {

  document.getElementById("editor")
  .style.display = "block";

  document.getElementById("titleInput")
  .focus();
}

function saveNote() {

  let title =
  document.getElementById("titleInput").value;

  let text =
  document.getElementById("textInput").value;

  if (title.trim() === "" &&
      text.trim() === "") {

    alert("আগে Note লিখুন!");
    return;
  }

  let notes =
  JSON.parse(localStorage.getItem("notes"))
  || [];

  let newNote = {
    title: title,
    text: text
  };

  if (editIndex === -1) {
    notes.push(newNote);
  } else {
    notes[editIndex] = newNote;
    editIndex = -1;
  }

  localStorage.setItem(
    "notes",
    JSON.stringify(notes)
  );

  document.getElementById("titleInput")
  .value = "";

  document.getElementById("textInput")
  .value = "";

  document.getElementById("editor")
  .style.display = "none";

  showNotes();
}

function showNotes() {

  let notes =
  JSON.parse(localStorage.getItem("notes"))
  || [];

  let search =
  document.getElementById("search")
  .value.toLowerCase();

  let container =
  document.getElementById("notes");

  container.innerHTML = "";

  notes.forEach(function(note, index) {

    let title =
    (note.title || "").toLowerCase();

    let text =
    (note.text || "").toLowerCase();

    if (
      title.includes(search) ||
      text.includes(search)
    ) {

      container.innerHTML += `

      <div class="note">

        <h3>📌 ${note.title}</h3>

        <p>${note.text}</p>

        <button
        class="edit"
        onclick="editNote(${index})">
        ✏️ Edit
        </button>

        <button
        class="delete"
        onclick="deleteNote(${index})">
        🗑️ Delete
        </button>

      </div>

      `;
    }

  });

}

function editNote(index) {

  let notes =
  JSON.parse(localStorage.getItem("notes"))
  || [];

  document.getElementById("titleInput")
  .value = notes[index].title;

  document.getElementById("textInput")
  .value = notes[index].text;

  editIndex = index;

  document.getElementById("editor")
  .style.display = "block";

  window.scrollTo(0, 0);
}

function deleteNote(index) {

  if (!confirm("এই Note Delete করবেন?")) {
    return;
  }

  let notes =
  JSON.parse(localStorage.getItem("notes"))
  || [];

  notes.splice(index, 1);

  localStorage.setItem(
    "notes",
    JSON.stringify(notes)
  );

  showNotes();
}

function darkMode() {

  document.body.classList.toggle("dark");

}

showNotes();

</script>

</body>
  </html>
