<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Notes</title>
<link rel="icon" type="image/png" href="icon.png">

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f2f4f7;
  color:#222;
  transition:.3s;
}

header{
  background:#222;
  color:white;
  padding:18px 15px;
  text-align:center;
}

header h1{
  margin:0 0 12px;
  font-size:28px;
}

.container{
  max-width:650px;
  margin:auto;
  padding:15px;
}

button{
  border:none;
  border-radius:10px;
  padding:12px 16px;
  font-size:15px;
  cursor:pointer;
}

.add{
  width:100%;
  background:#222;
  color:white;
  margin-bottom:15px;
}

input,textarea{
  width:100%;
  padding:14px;
  margin-bottom:12px;
  border:1px solid #ccc;
  border-radius:10px;
  font-size:16px;
  outline:none;
}

textarea{
  height:150px;
  resize:none;
}

.save{
  width:100%;
  background:#16834b;
  color:white;
  margin-bottom:15px;
}

.search{
  margin-top:5px;
}

.note{
  background:white;
  margin-top:15px;
  padding:16px;
  border-radius:12px;
  box-shadow:0 3px 10px #ccc;
}

.note h3{
  margin-top:0;
  word-break:break-word;
}

.note p{
  white-space:pre-wrap;
  word-break:break-word;
}

.date{
  color:#777;
  font-size:12px;
  margin-bottom:12px;
}

.edit{
  background:#ddd;
  margin-right:5px;
}

.delete{
  background:#d33;
  color:white;
}

.section-btn{
  width:100%;
  margin-top:10px;
  background:#1976d2;
  color:white;
}

#editor{
  display:none;
}

#calculator{
  display:none;
  background:white;
  padding:15px;
  border-radius:15px;
  box-shadow:0 3px 12px #ccc;
  margin-top:15px;
}

.calc-display{
  width:100%;
  height:60px;
  background:#111;
  color:white;
  border:none;
  border-radius:10px;
  font-size:26px;
  text-align:right;
  padding:10px;
  margin-bottom:10px;
}

.calc-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
}

.calc-grid button{
  height:55px;
  font-size:20px;
  background:#eee;
}

.calc-grid .operator{
  background:#ddd;
}

.calc-grid .equal{
  background:#16834b;
  color:white;
}

.calc-grid .clear{
  background:#d33;
  color:white;
}

#pinScreen{
  position:fixed;
  inset:0;
  background:#222;
  color:white;
  z-index:9999;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.pin-box{
  width:100%;
  max-width:350px;
  text-align:center;
}

.pin-box h2{
  font-size:28px;
}

.pin-box p{
  color:#ccc;
}

.pin-input{
  text-align:center;
  font-size:25px;
  letter-spacing:8px;
}

.pin-button{
  width:100%;
  background:#16834b;
  color:white;
}

.pin-error{
  color:#ff6b6b;
  min-height:22px;
}

.dark{
  background:#181818;
  color:white;
}

.dark .note,
.dark #calculator{
  background:#292929;
  color:white;
}

.dark input,
.dark textarea{
  background:#292929;
  color:white;
  border-color:#555;
}

.dark .edit{
  background:#555;
  color:white;
}

.dark header{
  background:#000;
}

.dark .calc-grid button{
  background:#444;
  color:white;
}

.dark .calc-grid .operator{
  background:#555;
}

.dark .date{
  color:#bbb;
}

.hidden{
  display:none !important;
}
</style>
</head>

<body>

<!-- PIN LOCK -->
<div id="pinScreen">
  <div class="pin-box">

    <h2>🔐 My Notes</h2>

    <p id="pinMessage">
      আপনার জন্য একটি 4–6 digit PIN তৈরি করুন
    </p>

    <input
      id="pinInput"
      class="pin-input"
      type="password"
      inputmode="numeric"
      maxlength="6"
      placeholder="••••••"
    >

    <div class="pin-error" id="pinError"></div>

    <button
      class="pin-button"
      onclick="submitPIN()">
      🔓 Continue
    </button>

  </div>
</div>


<header>

  <h1>📝 My Notes</h1>

  <button onclick="darkMode()">
    🌙 Dark Mode
  </button>

</header>


<div class="container">

  <button
    class="add"
    onclick="openEditor()">
    ➕ Add New Note
  </button>


  <button
    class="section-btn"
    onclick="toggleCalculator()">
    🧮 Calculator
  </button>


  <!-- NOTE EDITOR -->
  <div id="editor">

    <input
      id="titleInput"
      type="text"
      placeholder="Note-এর Title লিখুন">

    <textarea
      id="textInput"
      placeholder="আপনার Note লিখুন..."></textarea>

    <button
      class="save"
      onclick="saveNote()">
      💾 Save Note
    </button>

  </div>


  <!-- CALCULATOR -->
  <div id="calculator">

    <h2>🧮 Calculator</h2>

    <input
      id="calcDisplay"
      class="calc-display"
      type="text"
      readonly
      value="0">


    <div class="calc-grid">

      <button
        class="clear"
        onclick="clearCalc()">
        C
      </button>

      <button onclick="backspaceCalc()">
        ⌫
      </button>

      <button
        class="operator"
        onclick="calcInput('%')">
        %
      </button>

      <button
        class="operator"
        onclick="calcInput('/')">
        ÷
      </button>


      <button onclick="calcInput('7')">7</button>
      <button onclick="calcInput('8')">8</button>
      <button onclick="calcInput('9')">9</button>

      <button
        class="operator"
        onclick="calcInput('*')">
        ×
      </button>


      <button onclick="calcInput('4')">4</button>
      <button onclick="calcInput('5')">5</button>
      <button onclick="calcInput('6')">6</button>

      <button
        class="operator"
        onclick="calcInput('-')">
        −
      </button>


      <button onclick="calcInput('1')">1</button>
      <button onclick="calcInput('2')">2</button>
      <button onclick="calcInput('3')">3</button>

      <button
        class="operator"
        onclick="calcInput('+')">
        +
      </button>


      <button onclick="calcInput('0')">
        0
      </button>

      <button onclick="calcInput('.')">
        .
      </button>

      <button
        onclick="calcInput('(')">
        (
      </button>

      <button
        class="equal"
        onclick="calculate()">
        =
      </button>

    </div>

  </div>


  <!-- SEARCH -->

  <input
    class="search"
    id="search"
    type="text"
    placeholder="🔍 Note খুঁজুন..."
    oninput="showNotes()">


  <div id="notes"></div>


  <button
    class="section-btn"
    onclick="changePIN()">
    🔑 Change PIN
  </button>

</div>


<script>

let editIndex = -1;


/* =========================
   PIN SYSTEM
========================= */

function setupPIN(){

  let savedPIN =
    localStorage.getItem("notesPIN");

  if(savedPIN){

    document.getElementById("pinMessage").innerText =
      "আপনার PIN দিন";

  }else{

    document.getElementById("pinMessage").innerText =
      "প্রথমে একটি 4–6 digit PIN তৈরি করুন";

  }

}


function submitPIN(){

  let input =
    document.getElementById("pinInput").value.trim();

  let error =
    document.getElementById("pinError");

  if(!/^[0-9]{4,6}$/.test(input)){

    error.innerText =
      "PIN অবশ্যই 4–6 সংখ্যার হতে হবে।";

    return;
  }


  let savedPIN =
    localStorage.getItem("notesPIN");


  if(!savedPIN){

    localStorage.setItem(
      "notesPIN",
      input
    );

    unlockApp();

    return;
  }


  if(input === savedPIN){

    unlockApp();

  }else{

    error.innerText =
      "❌ PIN সঠিক নয়।";

    document.getElementById(
      "pinInput"
    ).value = "";

  }

}


function unlockApp(){

  document.getElementById(
    "pinScreen"
  ).classList.add("hidden");

  document.getElementById(
    "pinInput"
  ).value = "";

  showNotes();

}


function changePIN(){

  let oldPIN =
    prompt("বর্তমান PIN লিখুন:");

  if(oldPIN === null) return;


  let savedPIN =
    localStorage.getItem("notesPIN");


  if(oldPIN !== savedPIN){

    alert("❌ বর্তমান PIN সঠিক নয়।");

    return;
  }


  let newPIN =
    prompt("নতুন 4–6 digit PIN দিন:");

  if(newPIN === null) return;


  if(!/^[0-9]{4,6}$/.test(newPIN)){

    alert(
      "PIN অবশ্যই 4–6 সংখ্যার হতে হবে।"
    );

    return;
  }


  localStorage.setItem(
    "notesPIN",
    newPIN
  );

  alert("✅ PIN সফলভাবে পরিবর্তন হয়েছে।");

}


/* =========================
   NOTES
========================= */

function openEditor(){

  document.getElementById(
    "editor"
  ).style.display = "block";

  document.getElementById(
    "titleInput"
  ).focus();

}


function saveNote(){

  let title =
    document.getElementById(
      "titleInput"
    ).value.trim();


  let text =
    document.getElementById(
      "textInput"
    ).value.trim();


  if(title === "" && text === ""){

    alert("আগে Note লিখুন!");

    return;
  }


  let notes =
    JSON.parse(
      localStorage.getItem("notes")
    ) || [];


  let now =
    new Date().toLocaleString(
      "bn-BD"
    );


  let newNote = {

    title:title,

    text:text,

    date:now

  };


  if(editIndex === -1){

    notes.push(newNote);

  }else{

    notes[editIndex] =
      newNote;

    editIndex = -1;

  }


  localStorage.setItem(
    "notes",
    JSON.stringify(notes)
  );


  document.getElementById(
    "titleInput"
  ).value = "";


  document.getElementById(
    "textInput"
  ).value = "";


  document.getElementById(
    "editor"
  ).style.display = "none";


  showNotes();

}


function escapeHTML(text){

  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function showNotes(){

  let notes =
    JSON.parse(
      localStorage.getItem("notes")
    ) || [];


  let search =
    document.getElementById(
      "search"
    ).value.toLowerCase();


  let container =
    document.getElementById(
      "notes"
    );


  container.innerHTML = "";


  notes.forEach(
    function(note,index){

      let title =
        (note.title || "")
        .toLowerCase();


      let text =
        (note.text || "")
        .toLowerCase();


      if(
        title.includes(search) ||
        text.includes(search)
      ){

        container.innerHTML += `

          <div class="note">

            <h3>
              📌 ${escapeHTML(note.title)}
            </h3>

            <p>
              ${escapeHTML(note.text)}
            </p>

            <div class="date">
              📅 ${escapeHTML(note.date || "")}
            </div>

            <button
              class="edit"
              onclick="editNote(${index})">
              ✏️ Edit
            </button>

            <button
              class="delete"
              onclick="deleteNote(${index})">
              🗑️ Delete
            </button>

          </div>

        `;

      }

    }
  );

}


function editNote(index){

  let notes =
    JSON.parse(
      localStorage.getItem("notes")
    ) || [];


  document.getElementById(
    "titleInput"
  ).value =
    notes[index].title || "";


  document.getElementById(
    "textInput"
  ).value =
    notes[index].text || "";


  editIndex = index;


  document.getElementById(
    "editor"
  ).style.display = "block";


  window.scrollTo(
    0,
    0
  );

}


function deleteNote(index){

  if(
    !confirm(
      "এই Note Delete করবেন?"
    )
  ) return;


  let notes =
    JSON.parse(
      localStorage.getItem("notes")
    ) || [];


  notes.splice(
    index,
    1
  );


  localStorage.setItem(
    "notes",
    JSON.stringify(notes)
  );


  showNotes();

}


/* =========================
   DARK MODE
========================= */

function darkMode(){

  document.body.classList.toggle(
    "dark"
  );


  localStorage.setItem(
    "darkMode",
    document.body.classList.contains(
      "dark"
    )
  );

}


/* =========================
   CALCULATOR
========================= */

function toggleCalculator(){

  let calculator =
    document.getElementById(
      "calculator"
    );


  if(
    calculator.style.display ===
    "none" ||
    calculator.style.display === ""
  ){

    calculator.style.display =
      "block";

  }else{

    calculator.style.display =
      "none";

  }

}


function calcInput(value){

  let display =
    document.getElementById(
      "calcDisplay"
    );


  if(display.value === "0"){

    display.value = value;

  }else{

    display.value += value;

  }

}


function clearCalc(){

  document.getElementById(
    "calcDisplay"
  ).value = "0";

}


function backspaceCalc(){

  let display =
    document.getElementById(
      "calcDisplay"
    );


  display.value =
    display.value.slice(
      0,
      -1
    );


  if(display.value === ""){

    display.value = "0";

  }

}


function calculate(){

  let display =
    document.getElementById(
      "calcDisplay"
    );


  let expression =
    display.value;


  if(
    !/^[0-9+\-*/%.() ]+$/.test(
      expression
    )
  ){

    display.value =
      "Error";

    return;
  }


  try{

    let result =
      Function(
        '"use strict"; return (' +
        expression +
